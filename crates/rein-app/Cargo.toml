[package]
name = "rein-app"
description = "Installs, verifies and updates a signed Rein release; manages Claude profile settings."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "rein-app"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
rein-profiles = { version = "0.1.0", path = "../rein-profiles" }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"
