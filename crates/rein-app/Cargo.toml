[package]
name = "rein-app"
description = "Installs, verifies and updates a signed Rein release; manages Claude profile settings."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors = ["Emir Kovacevic"]
publish = false

[[bin]]
name = "rein-app"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
rein-profiles = { version = "0.1.0", path = "../rein-profiles" }
rein-release = { version = "0.1.0", path = "../rein-release" }
semver = "1.0.28"
serde_json = "1.0.154"

[dev-dependencies]
# The install pipeline test reuses rein-release's fixture builder (tests/support).
flate2 = "1.1.11"
minisign = "0.10.0"
sha2 = "0.11.1"
tar = "0.4.46"
tempfile = "3.27.0"

# `.deb` via cargo-deb in the release workflow (E-6, D-010). The binary only; the Rein home
# is operator data and is never installed or removed by the package.
[package.metadata.deb]
maintainer = "Emir Kovacevic <emirkovacevic@protonmail.com>"
section = "devel"
priority = "optional"
extended-description = "Installs, verifies and updates a signed Rein release into $HOME/.rein and manages Claude Code profile settings."
assets = [
    ["target/release/rein-app", "usr/bin/", "755"],
    # E-21: Apache-2.0 §4(d) — the license and NOTICE travel with the package.
    ["../../LICENSE", "usr/share/doc/rein-app/", "644"],
    ["../../NOTICE", "usr/share/doc/rein-app/", "644"],
]

[package.metadata.dist]
# publish = false keeps it off crates.io; dist still releases the binary.
dist = true

[package.metadata.wix]
upgrade-guid = "96C86356-32D7-4A0F-A291-90EBDB54BD32"
path-guid = "C882D330-1E0E-4F1C-8A4F-09C9D328FDB2"
license = false
eula = false
