[package]
name = "rein-app"
description = "Installs, verifies and updates a signed Rein release; manages Claude profile settings."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "rein-app"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
rein-profiles = { version = "0.1.0", path = "../rein-profiles" }
rein-release = { version = "0.1.0", path = "../rein-release" }
semver = "1.0.28"
serde_json = "1.0.154"

[dev-dependencies]
# The install pipeline test reuses rein-release's fixture builder (tests/support).
flate2 = "1.1.11"
minisign = "0.10.0"
sha2 = "0.11.1"
tar = "0.4.46"
tempfile = "3.27.0"
