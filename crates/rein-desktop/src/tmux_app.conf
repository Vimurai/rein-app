# rein-app's own tmux config (desktop.md §Look and feel v2 V8 component 4, D-055): the
# server the window's sessions run on has read this file and nothing else. A closed list —
# no run-shell, source-file, if-shell, hook or plugin line; a test reads this file to hold
# that. Everything else is tmux's default (prefix C-b). set-clipboard is tmux's default,
# external: a program in a pane cannot set the host clipboard through OSC 52.
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g mouse on
set -sg escape-time 10
set -g focus-events on
set -g history-limit 50000
set -g set-clipboard external
set -g status off
