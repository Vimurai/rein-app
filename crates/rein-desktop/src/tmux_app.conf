# rein-app's own tmux config (desktop.md §Look and feel v2 V8 component 4, D-055): the
# server the window's sessions run on has read this file and nothing else. A closed list —
# no run-shell, source-file, if-shell, hook or plugin line; a test reads this file to hold
# that. Everything else is tmux's default (prefix C-b). set-clipboard is tmux's default,
# external: a program in a pane cannot set the host clipboard through OSC 52. The pane
# labels (E-58) show the role rein gives each pane (`@rein_role`, `@rein_account`, set by
# rein start / rein pane) and are built from tmux variables only — the file holds no shell
# substitution at all; they take the border colours the window's overlay sets.
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g mouse on
set -sg escape-time 10
set -g focus-events on
set -g history-limit 50000
set -g set-clipboard external
set -g status off
set -g pane-border-status top
set -g pane-border-format " #{?#{@rein_role},#{@rein_role} · #{@rein_account},#{pane_index}} "
