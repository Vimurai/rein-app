[package]
name = "rein-release"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
flate2 = "1.1.11"
minisign-verify = "0.3.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = { version = "0.4.46", default-features = false }

[dev-dependencies]
flate2 = "1.1.11"
minisign = "0.10.0"
semver = "1.0.28"
sha2 = "0.11.1"
tar = "0.4.46"
tempfile = "3.27.0"

[features]
# Kill switch (blueprint §Rollback Plan): trust no key, so every install fails closed.
reject-all-signatures = []
