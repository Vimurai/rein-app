# .deb packages for the release (cargo-dist local-artifacts job, E-6 / D-010).
# Called by release.yml with the dist plan; uploads `artifacts-deb-*`, which the dist host
# job attaches to the GitHub release.
name: build-linux-packages

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  deb:
    name: deb (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-22.04 }
          - { arch: arm64, runner: ubuntu-22.04-arm }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Check the committed rein release public key
        shell: bash
        run: |
          F=docs/contract/release-key.pub
          if [ ! -f "$F" ] || [ -L "$F" ]; then
            echo "::error::$F is missing (D-014: the release trust root is a committed copy of rein's file) — refusing to build a release that cannot verify rein"
            exit 1
          fi
          if ! tr -d '\000' < "$F" | cmp -s - "$F" \
            || [ "$(awk 'END { print NR }' "$F")" != 2 ] \
            || ! sed -n 1p "$F" | grep -Eq '^untrusted comment: minisign public key:? [0-9A-F]{16}$' \
            || ! sed -n 2p "$F" | grep -Eq '^RW[A-Za-z0-9+/]{54}$'; then
            echo "::error::$F is not a minisign public key file (2 lines: comment with key id, base64 Ed25519 key)"
            exit 1
          fi
          # A minisign Ed25519 public key starts with the algorithm bytes "Ed".
          if [ "$(sed -n 2p "$F" | base64 -d | head -c 2)" != Ed ]; then
            echo "::error::$F is not a minisign Ed25519 public key"
            exit 1
          fi
          # The id in the comment must be the id inside the key (bytes 2..10, little-endian).
          NAMED=$(sed -n 1p "$F" | awk '{ print $NF }')
          ACTUAL=$(sed -n 2p "$F" | base64 -d | od -An -tx1 -j2 -N8 | awk '{ for (i = NF; i > 0; i--) printf "%s", toupper($i); print "" }')
          if [ "$NAMED" != "$ACTUAL" ]; then
            echo "::error::$F comment names key $NAMED but the key is $ACTUAL"
            exit 1
          fi
          echo "release key: $ACTUAL"
      - name: Install Rust toolchain and cargo-deb
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo install cargo-deb --version 3.8.0 --locked
      - name: Build .deb
        run: cargo deb -p rein-app --locked --output target/debian/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-deb-${{ matrix.arch }}
          path: target/debian/*.deb
          if-no-files-found: error
