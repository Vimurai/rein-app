# .deb packages for the release (cargo-dist local-artifacts job, E-6 / D-010).
# Called by release.yml with the dist plan; uploads `artifacts-deb-*`, which the dist host
# job attaches to the GitHub release.
name: build-linux-packages

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  deb:
    name: deb (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-22.04 }
          - { arch: arm64, runner: ubuntu-22.04-arm }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Bake the rein release public key
        shell: bash
        env:
          PUBKEY: ${{ vars.REIN_RELEASE_PUBKEY }}
        run: |
          if [ -z "$PUBKEY" ]; then
            echo "::error::repository variable REIN_RELEASE_PUBKEY is not set (rein P-50) — refusing to build a release that cannot verify rein"
            exit 1
          fi
          if ! printf '%s' "$PUBKEY" | grep -Eq '^[A-Za-z0-9+/]+={0,2}$'; then
            echo "::error::REIN_RELEASE_PUBKEY is not a single base64 line"
            exit 1
          fi
          echo "REIN_RELEASE_PUBKEY=$PUBKEY" >> "$GITHUB_ENV"
      - name: Install Rust toolchain and cargo-deb
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo install cargo-deb --version 3.8.0 --locked
      - name: Build .deb
        run: cargo deb -p rein-app --locked --output target/debian/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-deb-${{ matrix.arch }}
          path: target/debian/*.deb
          if-no-files-found: error
