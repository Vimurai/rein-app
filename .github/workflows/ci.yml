name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # E-34: the window crate on Linux and macOS; E-43 (D-038): on Windows too (WebView2,
        # WslHost) — every OS now builds and tests the whole workspace.
        include:
          - os: ubuntu-latest
            desktop: true
          - os: macos-latest
            desktop: true
          - os: windows-latest
            desktop: true
    env:
      CRATES: ${{ matrix.desktop && '--workspace' || '--workspace --exclude rein-desktop' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: release-key guard corpus (D-017)
        shell: bash
        run: bash .github/scripts/test-release-key-scripts.sh
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Install WebKitGTK (Linux, D-035)
        if: matrix.desktop && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.desktop
        with:
          node-version: 24
      - name: window UI — install, type-check, test, bundle
        if: matrix.desktop
        working-directory: crates/rein-desktop/ui
        run: |
          npm ci --ignore-scripts
          npm run check
          npm test
          npm run build
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        shell: bash
        run: cargo clippy $CRATES --all-targets --locked -- -D warnings
      - name: test
        shell: bash
        run: cargo test $CRATES --locked
