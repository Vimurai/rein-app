# Inserted by cargo-dist before every release build (github-build-setup, E-6 / D-010).
# The minisign public key is baked into rein-app at build time from the committed
# docs/contract/release-key.pub (D-014, E-16). A release built without a valid key trusts
# nothing and every install would fail closed — refuse to build one. The check lives in one
# script, tested in ci.yml on all three OSes (D-017, E-22).
- name: Check the committed rein release public key
  shell: bash
  run: bash .github/scripts/check-release-key.sh
