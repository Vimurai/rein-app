# Inserted by cargo-dist before every release build (github-build-setup, E-6 / D-010).
# The minisign public key is baked into rein-app at build time from the committed
# docs/contract/release-key.pub (D-014, E-16), a byte-for-byte copy of rein's file. A
# release built without a valid key trusts nothing and every install would fail closed —
# refuse to build one.
- name: Check the committed rein release public key
  shell: bash
  run: |
    F=docs/contract/release-key.pub
    if [ ! -f "$F" ] || [ -L "$F" ]; then
      echo "::error::$F is missing (D-014: the release trust root is a committed copy of rein's file) — refusing to build a release that cannot verify rein"
      exit 1
    fi
    if ! tr -d '\000' < "$F" | cmp -s - "$F" \
      || [ "$(awk 'END { print NR }' "$F")" != 2 ] \
      || ! sed -n 1p "$F" | grep -Eq '^untrusted comment: minisign public key:? [0-9A-F]{16}$' \
      || ! sed -n 2p "$F" | grep -Eq '^RW[A-Za-z0-9+/]{54}$'; then
      echo "::error::$F is not a minisign public key file (2 lines: comment with key id, base64 Ed25519 key)"
      exit 1
    fi
    # A minisign Ed25519 public key starts with the algorithm bytes "Ed".
    if [ "$(sed -n 2p "$F" | base64 -d | head -c 2)" != Ed ]; then
      echo "::error::$F is not a minisign Ed25519 public key"
      exit 1
    fi
    # The id in the comment must be the id inside the key (bytes 2..10, little-endian).
    NAMED=$(sed -n 1p "$F" | awk '{ print $NF }')
    ACTUAL=$(sed -n 2p "$F" | base64 -d | od -An -tx1 -j2 -N8 | awk '{ for (i = NF; i > 0; i--) printf "%s", toupper($i); print "" }')
    if [ "$NAMED" != "$ACTUAL" ]; then
      echo "::error::$F comment names key $NAMED but the key is $ACTUAL"
      exit 1
    fi
    echo "release key: $ACTUAL"
